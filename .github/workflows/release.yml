name: Release

# Builds installers for every OS into a draft GitHub release named after the
# app version in src-tauri/tauri.conf.json (e.g. v0.1.0).
# Trigger: push to the `release` branch, push a `v*` tag, or run manually.
on:
  push:
    branches: [release]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing (optional, add later):
          # APPLE_CERTIFICATE / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID for macOS notarization
        with:
          tagName: v__VERSION__
          releaseName: "Cantin v__VERSION__"
          releaseBody: "See the assets below to download Cantin for your OS."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Prebuilt `cantin` command-line tool, attached to the same draft release.
  cli:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p cantin-cli --target ${{ matrix.target }}
      - name: Package and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          DIR=target/${{ matrix.target }}/release
          NAME=cantin-${{ matrix.target }}
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$NAME.zip" "./$DIR/cantin.exe"
            FILE="$NAME.zip"
          else
            tar -C "$DIR" -czf "$NAME.tar.gz" cantin
            FILE="$NAME.tar.gz"
          fi
          gh release upload "v$VERSION" "$FILE" --clobber --repo "$GITHUB_REPOSITORY"
