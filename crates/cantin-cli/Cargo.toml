[package]
name = "cantin-cli"
description = "Command-line interface for the Cantin storage analyzer"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cantin"
path = "src/main.rs"

[dependencies]
cantin-core = { path = "../cantin-core" }
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.5", features = ["derive"] }
